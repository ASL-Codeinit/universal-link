<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignLink | Video Call</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/call.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo-small">🤟</div>
            <div class="header-info">
                <h2 id="userNameDisplay">Loading...</h2>
                <div class="room-code">
                    Room: <span id="roomIdDisplay">...</span>
                </div>
            </div>
        </div>
        <button class="copy-btn-small" onclick="copyRoomLink()">📋 Copy Link</button>
    </div>

<div class="main-container">
        <div class="remote-panel">
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">
                    <span class="status-dot"></span>
                    <span id="remoteName">Waiting for friend...</span>
                </div>
                
                <div class="subtitle-overlay" id="remoteSubtitles">
                    <div class="subtitle-text" id="remoteSubtitleText">Waiting for connection...</div>
                </div>
            </div>

            <div class="status-message" id="statusMessage">
                <h3>Connecting...</h3>
                <p id="statusText">Waiting for friend to join</p>
                <div class="loader"></div>
            </div>
        </div>

        <div class="local-video-section">
            <div class="video-wrapper">
                <video id="localVideo" autoplay muted playsinline></video>
                <canvas id="localCanvas" class="overlay-canvas"></canvas>
                <div class="video-label">
                    <span class="status-dot"></span>
                    You
                </div>

                <div id="localLiveHUD" style="position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.65); color: #fff; padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 11px; pointer-events: none; border: 1px solid rgba(255,255,255,0.1); z-index: 10; display: block;">
                    ML: Idle
                </div>

                <div class="detection-indicator inactive" id="localDetection">
                    <span class="pulse-dot"></span>
                    <span>Detecting...</span>
                </div>

                <div class="subtitle-overlay" id="localSubtitles">
                    <div class="subtitle-text" id="localSubtitleText">Waiting for signs...</div>
                </div>
            </div>
        </div>

        <div class="local-panel close-drawer" id="chatDrawer">
            <div class="chat-section">
                <div class="chat-header">
                    <h3>📝 Transcript</h3>
                    <button class="clear-chat-btn" onclick="clearTranscript()">Clear</button>
                </div>
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-empty">Sign language translations will appear here...</div>
                </div>
            </div>
        </div>

    </div> ```

    <!-- Bottom Controls -->
    <div class="controls-bar">
        <button class="control-btn mute" id="micBtn" data-tooltip="Mute Audio" onclick="toggleMic()">
            🎤
        </button>
        <button class="control-btn mute" id="cameraBtn" data-tooltip="Turn Off Camera" onclick="toggleCamera()">
            📹
        </button>
        <button class="control-btn" id="chatToggleBtn" data-tooltip="Toggle Chat" onclick="toggleChatDrawer()">
            💬
        </button>
        <button class="control-btn end-call" data-tooltip="End Call" onclick="endCall()">
            📞
        </button>
    </div>

    <!-- Hidden canvas for processing -->
    <canvas id="processingCanvas"></canvas>

    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620248257/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/script.js"></script>
    
    <script>
        // Get user info from sessionStorage
        const userName = sessionStorage.getItem('userName') || 'Guest';
        document.getElementById('userNameDisplay').textContent = userName;
    </script>
</body>
</html>
