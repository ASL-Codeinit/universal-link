<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignLink | Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/setup.css">
</head>
<body>
<div class="card">

    <!-- Brand -->
    <div class="brand">
        <div class="logo-small" aria-label="SignLink logo"></div>
        <div>
            <h1>SignLink</h1>
            <p>Pre-call setup</p>
        </div>
    </div>

    <!-- Camera preview -->
    <div class="camera-block">
        <video id="previewVideo" autoplay muted playsinline></video>
        <div class="cam-permission-msg" id="camMsg">
            <div class="icon">📷</div>
            <span>Requesting camera access…</span>
        </div>
    </div>
    <p class="cam-error-note" id="camError">
        Camera access was denied. You can still join — video will be off.
    </p>

    <!-- Identity -->
    <div class="identity">
        <div class="identity-left">
            <span class="identity-label">Joining as</span>
            <span class="identity-name" id="identityName">—</span>
        </div>
        <span class="role-badge" id="roleBadge">—</span>
    </div>

    <!-- Backend status -->
    <div>
        <div class="status-block" id="statusBlock">
            <div class="status-icon checking" id="statusIcon">⏳</div>
            <div class="status-text">
                <span class="status-title" id="statusTitle">Waking up ML backend…</span>
                <span class="status-sub"  id="statusSub">Azure cold start may take ~30 s</span>
            </div>
            <span class="status-dot checking" id="statusDot"></span>
        </div>
        <div class="progress-wrap" id="progressWrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- Join -->
    <button class="join-btn" id="joinBtn" disabled onclick="joinCall()">
        Waiting for backend…
    </button>

</div>

<script>
// ─── 1. Session state ─────────────────────────────────────────────────────────
const userName = sessionStorage.getItem('userName') || 'Guest';
const userMode = sessionStorage.getItem('userMode') || 'speaker';
const roomId   = new URLSearchParams(window.location.search).get('room');
if (!roomId) { window.location.href = '/'; }

// ─── 2. Backend — hostname decides, no probing ────────────────────────────────
const IS_LOCAL = window.location.hostname === 'localhost'
              || window.location.hostname === '127.0.0.1';
const ACTIVE_BASE = IS_LOCAL
    ? 'http://127.0.0.1:8000'
    : 'https://universal-link-backend.kindbay-309802f0.southeastasia.azurecontainerapps.io';
const HEALTH_URL = `${ACTIVE_BASE}/health`;
console.log('🔗 Backend:', ACTIVE_BASE);

// ─── 3. Identity strip ────────────────────────────────────────────────────────
document.getElementById('identityName').textContent = userName;
const badge = document.getElementById('roleBadge');
if (userMode === 'signer') {
    badge.textContent = '🤟 Signer';
    badge.className   = 'role-badge signer';
} else {
    badge.textContent = '🗣️ Listener';
    badge.className   = 'role-badge listener';
}

// ─── 4. Camera access ─────────────────────────────────────────────────────────
const video  = document.getElementById('previewVideo');
const camMsg = document.getElementById('camMsg');

async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
        sessionStorage.setItem('cameraGranted', 'true');
        camMsg.classList.add('hidden');
    } catch (err) {
        camMsg.querySelector('span').textContent = 'Camera unavailable';
        document.getElementById('camError').classList.add('visible');
    }
}
startCamera();

// ─── 5. Backend health polling ────────────────────────────────────────────────
const MAX_WAIT_MS = 90_000;
const POLL_MS     = 3_000;

let pollStart   = Date.now();
let pollTimer   = null;
let backendLive = false;

const statusIcon   = document.getElementById('statusIcon');
const statusTitle  = document.getElementById('statusTitle');
const statusSub    = document.getElementById('statusSub');
const statusDot    = document.getElementById('statusDot');
const progressWrap = document.getElementById('progressWrap');
const progressBar  = document.getElementById('progressBar');
const joinBtn      = document.getElementById('joinBtn');

function setChecking() {
    statusIcon.className    = 'status-icon checking';
    statusIcon.textContent  = '⏳';
    statusDot.className     = 'status-dot checking';
    statusTitle.textContent = IS_LOCAL ? 'Connecting to local backend…' : 'Waking up ML backend…';
    statusSub.textContent   = IS_LOCAL ? 'Make sure uvicorn is running' : 'Azure cold start may take ~30 s';
    progressWrap.classList.add('visible');
}

function setLive() {
    backendLive = true;
    statusIcon.className    = 'status-icon live';
    statusIcon.textContent  = '✅';
    statusDot.className     = 'status-dot live';
    statusTitle.textContent = 'ML backend is live';
    statusSub.textContent   = IS_LOCAL ? 'Local server ready' : 'Azure backend ready';
    progressWrap.classList.remove('visible');
    joinBtn.disabled    = false;
    joinBtn.textContent = 'Join Call →';
    if (pollTimer) clearInterval(pollTimer);
}

function setError() {
    statusIcon.className    = 'status-icon error';
    statusIcon.textContent  = '⚠️';
    statusDot.className     = 'status-dot error';
    statusTitle.textContent = 'Backend unreachable';
    statusSub.textContent   = 'You can still join — predictions may not work';
    progressWrap.classList.remove('visible');
    joinBtn.disabled    = false;
    joinBtn.textContent = 'Join Anyway →';
    if (pollTimer) clearInterval(pollTimer);
}

async function pollHealth() {
    const elapsed = Date.now() - pollStart;
    progressBar.style.width = Math.min((elapsed / MAX_WAIT_MS) * 100, 98) + '%';
    try {
        const resp = await fetch(HEALTH_URL, { signal: AbortSignal.timeout(5000) });
        if (resp.ok) {
            const data = await resp.json();
            if (data.model_loaded || data.status === 'healthy') {
                progressBar.style.width = '100%';
                setLive();
                return;
            }
        }
    } catch (_) { /* still waiting */ }
    if (elapsed >= MAX_WAIT_MS) setError();
}

setChecking();
pollHealth();
pollTimer = setInterval(pollHealth, POLL_MS);

// ─── 6. Join ──────────────────────────────────────────────────────────────────
function joinCall() {
    if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
    }
    window.location.href = `/video?room=${roomId}`;
}
</script>
</body>
</html>
